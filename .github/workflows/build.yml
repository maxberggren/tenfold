# Builds tenfold, runs every test and packages it, for x86_64 and arm64:
#
#   arch     the pacman package, built and tested on Arch
#   bundle   tenfold with its own Qt for every other Linux, built and tested
#            on Debian 12 (the oldest glibc it supports) with Qt's own build
#   try      the bundle installed by site/install.sh on other distributions,
#            then run: a render, a song check and a screenshot of the window
#   nix      the flake, for NixOS
#
# A version tag (v0.2.0) also publishes a release with the packages, the
# bundles and their checksums, which the install script fetches.
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arch:
    name: arch ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: archlinux:latest
          # Arch Linux ARM has no official image; this community one is
          # kept current and is what most ALARM builds on GitHub use.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: menci/archlinuxarm:latest
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 45
    # Built for any processor of the architecture, not the runner's own.
    env:
      TENFOLD_PORTABLE: 1
    steps:
      # pacman's download sandbox (Landlock) can't be set up inside some
      # containers (the ARM runner's), so it is turned off: the packages
      # are still checked against their signatures.
      - name: Install what it builds with
        run: |
          grep -q '^DisableSandbox' /etc/pacman.conf || sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          pacman -Syu --noconfirm --needed base-devel git \
            qt6-base qt6-declarative qt6-wayland libpipewire pipewire polkit \
            noto-fonts ttf-jetbrains-mono-nerd

      - uses: actions/checkout@v4

      - name: Build
        run: bin/build

      - name: Test
        run: bin/test

      # makepkg won't run as root; the package is built by a user of its own.
      # On a tag the package takes the tag's version (v0.2.0 → 0.2.0).
      - name: Package
        run: |
          case "$GITHUB_REF" in
          refs/tags/v*) sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/" pkgbuild/PKGBUILD ;;
          esac
          useradd -m builder
          chown -R builder .
          su builder -c 'cd pkgbuild && TENFOLD_PORTABLE=1 PKGEXT=.pkg.tar.zst makepkg -f --nodeps'
          ls -l pkgbuild/*.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: tenfold-${{ matrix.arch }}
          path: pkgbuild/*.pkg.tar.zst
          if-no-files-found: error

  bundle:
    name: bundle ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
    runs-on: ${{ matrix.runner }}
    container: debian:12
    timeout-minutes: 60
    env:
      QT_VERSION: 6.8.3
    steps:
      - name: Install what it builds with
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config git curl ca-certificates file python3-venv \
            libpipewire-0.3-dev libgl-dev libegl-dev libopengl-dev libglx-dev \
            libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0 \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libx11-xcb1 libsm6 libice6 fonts-dejavu-core

      # Qt's own build, not Debian's (6.4): the version tenfold is written
      # for, and the libraries the bundle carries.
      - name: Install Qt ${{ env.QT_VERSION }}
        run: |
          python3 -m venv /opt/aqt
          /opt/aqt/bin/pip install -q aqtinstall
          /opt/aqt/bin/aqt list-qt ${{ matrix.qt_host }} desktop --modules $QT_VERSION ${{ matrix.qt_arch }} || true
          /opt/aqt/bin/aqt install-qt -O /opt/qt ${{ matrix.qt_host }} desktop $QT_VERSION ${{ matrix.qt_arch }}
          qtdir=$(dirname "$(dirname "$(find /opt/qt -path '*/bin/qmake' | head -n 1)")")
          if ! ls "$qtdir"/plugins/platforms/libqwayland* >/dev/null 2>&1; then
            /opt/aqt/bin/aqt install-qt -O /opt/qt ${{ matrix.qt_host }} desktop $QT_VERSION ${{ matrix.qt_arch }} -m qtwayland
          fi
          ls "$qtdir"/plugins/platforms
          echo "QMAKE=$qtdir/bin/qmake" >>"$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Test
        run: bin/test

      - name: Bundle
        run: |
          case "$GITHUB_REF" in
          refs/tags/v*) version=${GITHUB_REF_NAME#v} ;;
          *) version=dev ;;
          esac
          bin/bundle "$version"
          find build/bundle/tenfold -maxdepth 3 | sort | head -80

      - uses: actions/upload-artifact@v4
        with:
          name: tenfold-bundle-${{ matrix.arch }}
          path: build/tenfold-*-linux.tar.gz
          if-no-files-found: error

  try:
    name: try ${{ matrix.distro }} ${{ matrix.arch }}
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu, image: 'ubuntu:24.04', arch: x86_64, runner: ubuntu-24.04 }
          - { distro: debian, image: 'debian:12', arch: x86_64, runner: ubuntu-24.04 }
          - { distro: fedora, image: 'fedora:latest', arch: x86_64, runner: ubuntu-24.04 }
          - { distro: opensuse, image: 'opensuse/tumbleweed', arch: x86_64, runner: ubuntu-24.04 }
          - { distro: ubuntu, image: 'ubuntu:24.04', arch: aarch64, runner: ubuntu-24.04-arm }
          - { distro: fedora, image: 'fedora:latest', arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 20
    steps:
      # What every desktop already has (OpenGL, fonts, D-Bus, a keyboard
      # map), so the install script is left to add what a desktop may not:
      # PipeWire's library and pkexec.
      - name: Make it a desktop's baseline
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends curl ca-certificates libgl1 libegl1 libopengl0 \
              libfontconfig1 libdbus-1-3 libglib2.0-0 libxkbcommon0 libwayland-client0 libwayland-egl1 libwayland-cursor0 \
              libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-xkb1 libxkbcommon-x11-0
          elif command -v dnf >/dev/null; then
            dnf install -y -q curl findutils mesa-libGL mesa-libEGL libglvnd-opengl fontconfig dbus-libs glib2 \
              libxkbcommon libxkbcommon-x11 libwayland-client libwayland-egl libwayland-cursor xcb-util-cursor
          elif command -v zypper >/dev/null; then
            zypper -n -q install curl gzip tar Mesa-libGL1 Mesa-libEGL1 libOpenGL0 fontconfig libdbus-1-3 libglib-2_0-0 \
              libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-egl1 libwayland-cursor0 libxcb-cursor0
          fi

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tenfold-bundle-${{ matrix.arch }}
          path: dist

      - name: Install with site/install.sh
        run: TENFOLD_BUNDLE=$(ls dist/tenfold-*-linux.tar.gz) sh site/install.sh </dev/null

      - name: Run it
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          tenfold --help
          tenfold render docs/parts/arp/ten-sounds.tf out.wav --json
          tenfold screenshot shot.png docs/parts/lead/anthem.tf --page 4 --at 10
          test -s shot.png

      - uses: actions/upload-artifact@v4
        with:
          name: shot-${{ matrix.distro }}-${{ matrix.arch }}
          path: shot.png

      - name: Uninstall
        run: |
          sh site/install.sh --uninstall </dev/null
          test ! -e "$HOME/.local/lib/tenfold"

  nix:
    name: nix ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the flake
        run: nix build -L .#default
      - name: Run it
        run: |
          ./result/bin/tenfold --help
          ./result/bin/tenfold render docs/parts/arp/ten-sounds.tf out.wav --json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [arch, bundle, try]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tenfold-*
          merge-multiple: true

      # A checksum beside each package, which the install script checks.
      - name: Checksums
        working-directory: dist
        run: for f in *.pkg.tar.zst *.tar.gz; do sha256sum "$f" >"$f.sha256"; done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "tenfold ${GITHUB_REF_NAME#v}" --generate-notes
