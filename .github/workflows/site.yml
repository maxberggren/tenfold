# Publishes site/ (the install page and its install script) to GitHub Pages:
# https://maxberggren.github.io/tenfold/
name: Site

on:
  push:
    branches: [master]
    paths: ['site/**', 'docs/screenshot.png', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: The screenshot goes with the page
        run: cp docs/screenshot.png site/screenshot.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
