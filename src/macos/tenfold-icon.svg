<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The Linux icon (pkgbuild/tenfold.svg) on macOS's rounded square: an
       824-unit body inside a 1024 canvas, with the system's soft shadow. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22222a"/>
      <stop offset="1" stop-color="#0b0b0e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect x="100" y="114" width="824" height="824" rx="185" fill="#000" opacity="0.45" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <g transform="translate(146.3 146.4) scale(11.4286)">
    <rect x="4" y="12" width="56" height="40" rx="7" fill="#141418" stroke="#FFD60A" stroke-width="2"/>
    <path d="M8 44 Q16 30 22 40 T34 34 T46 26 T56 38" fill="none" stroke="#FFD60A" stroke-width="2.4" stroke-linecap="round" opacity="0.55" filter="url(#glow)"/>
    <path d="M8 44 Q16 30 22 40 T34 34 T46 26 T56 38" fill="none" stroke="#FFD60A" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="22" cy="24" r="3.2" fill="#FFD60A"/>
    <circle cx="32" cy="21" r="3.2" fill="#9D7CFF"/>
    <circle cx="42" cy="24" r="3.2" fill="#6EE7F9"/>
  </g>
</svg>
